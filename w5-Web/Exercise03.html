
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox Layout</title>
  
</head>

<style>
    
body {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  gap: 10px;
}

.header,
.footer {
  background: #333;
  color: white;
  text-align: center;
  padding: 20px;
}

.content {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 10px;
}

.main,
.sidebar {
  padding: 20px;
}

.main {
  background: #f2f2f2;
  flex: 3;
}

.sidebar {
  background: #ddd;
  flex: 1;
}


@media (min-width: 600px) {
  .content {
    flex-direction: row;
  }

  .header,
  .footer {
    padding: 25px;
  }
}


@media (min-width: 900px) {
  .header,
  .footer {
    padding: 35px;
    font-size: 20px;
  }

  .main {
    flex: 4;
  }

  .sidebar {
    flex: 1;
  }
}

</style>
<body>
  <div class="container">
    <header class="header">Responsive Header</header>

    <div class="content">
      <main class="main">Main Content</main>
      <aside class="sidebar">Sidebar</aside>
    </div>

    <footer class="footer">Footer</footer>
  </div>
</body>
</html>
